            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: 25
        distribution: zulu
    - uses: actions/setup-node@v7
      with:
        node-version: 26
    - uses: coursier/cache-action@v8
    - run: ./sbt -v -Dscala_js_wasm rootJS/Test/compile rootJS/test
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
