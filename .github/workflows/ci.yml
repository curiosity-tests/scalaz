    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: 25
        distribution: zulu
    - uses: coursier/cache-action@v8
    - id: scala_3_version
      run: echo "value=$(cat .github/scala_3_latest.txt)" >> $GITHUB_OUTPUT
    - run: ./sbt -v -Dscalaz_scala3_version="${{ steps.scala_3_version.outputs.value }}" "print rootJVM/scalaVersion" Test/compile
    - name: Check observables and crashes
